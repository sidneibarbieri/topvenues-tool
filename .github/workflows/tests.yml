name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Reproduce on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          PYTHON: python
        run: bash reproduce.sh

      - name: Reproduce on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\reproduce.ps1 -PythonCommand python
